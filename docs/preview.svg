<svg xmlns="http://www.w3.org/2000/svg" width="820" height="320" viewBox="0 0 820 320" font-family="-apple-system, 'Segoe UI', system-ui, sans-serif" font-size="13">
  <!-- Preview of usage-band in the Claude desktop app (dark theme): same pills, colors, icons and tooltip layout as hooks/register.tsx -->
  <defs>
    <filter id="shadow" x="-10%" y="-20%" width="120%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <g id="info">
      <circle cx="7" cy="7" r="5.6" fill="none" stroke="#8e8d89" stroke-width="1.2"/>
      <line x1="7" y1="6.3" x2="7" y2="9.8" stroke="#8e8d89" stroke-width="1.2" stroke-linecap="round"/>
      <circle cx="7" cy="4.3" r="0.8" fill="#8e8d89"/>
    </g>
  </defs>

  <rect width="820" height="320" rx="12" fill="#1f1e1c"/>

  <!-- Collapsed -->
  <text x="24" y="28" font-size="11" fill="#7a7975">Collapsed</text>
  <rect x="16" y="38" width="788" height="44" rx="10" fill="#2a2927"/>
  <g transform="translate(0,65)">
    <text x="32" y="0" fill="#d29922">✦</text>
    <text x="54" y="0" fill="#8e8d89">5h</text>
    <rect x="76" y="-8.5" width="84" height="5" rx="2.5" fill="rgba(128,128,128,0.28)"/>
    <rect x="76" y="-8.5" width="45" height="5" rx="2.5" fill="#d29922"/>
    <text x="170" y="0" font-weight="700" fill="#d29922">53%</text>
    <text x="230" y="0" fill="#8e8d89">7d</text>
    <rect x="252" y="-8.5" width="84" height="5" rx="2.5" fill="rgba(128,128,128,0.28)"/>
    <rect x="252" y="-8.5" width="18" height="5" rx="2.5" fill="#3fb950"/>
    <text x="346" y="0" font-weight="700" fill="#3fb950">22%</text>
    <use href="#info" x="742" y="-11"/>
    <path d="M778.5 -1 782 -4.5l3.5 3.5" fill="none" stroke="#8e8d89" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Expanded, hovering the info icon -->
  <text x="24" y="128" font-size="11" fill="#7a7975">Expanded · hovering ⓘ</text>
  <rect x="16" y="206" width="788" height="98" rx="10" fill="#2a2927"/>
  <g transform="translate(0,234)">
    <text x="32" y="0" font-weight="700" fill="#ecebe8">✦ Plan usage</text>
    <text x="134" y="0" fill="#d29922">◆ moderate</text>
    <use href="#info" x="742" y="-11"/>
    <path d="M778.5 -6 782 -2.5l3.5 -3.5" fill="none" stroke="#8e8d89" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <g transform="translate(0,262)">
    <text x="32" y="0" fill="#8e8d89">5-hour</text>
    <rect x="100" y="-9" width="220" height="8" rx="4" fill="rgba(128,128,128,0.28)"/>
    <rect x="100" y="-9" width="117" height="8" rx="4" fill="#d29922"/>
    <text x="334" y="0" font-weight="700" fill="#d29922">53%</text>
  </g>
  <g transform="translate(0,288)">
    <text x="32" y="0" fill="#8e8d89">Weekly</text>
    <rect x="100" y="-9" width="220" height="8" rx="4" fill="rgba(128,128,128,0.28)"/>
    <rect x="100" y="-9" width="48" height="8" rx="4" fill="#3fb950"/>
    <text x="334" y="0" font-weight="700" fill="#3fb950">22%</text>
  </g>

  <!-- Tooltip popover -->
  <g filter="url(#shadow)">
    <rect x="540" y="114" width="250" height="82" rx="8" fill="#30302d" stroke="#45443f"/>
  </g>
  <text x="556" y="137" fill="#8e8d89">Resets in</text>
  <g transform="translate(0,160)">
    <circle cx="561" cy="-4.5" r="3.5" fill="#d29922"/>
    <text x="572" y="0" fill="#8e8d89">5-hour</text>
    <text x="634" y="0" font-weight="700" fill="#ecebe8">2h 41m</text>
    <text x="704" y="0" fill="#8e8d89">14:30</text>
  </g>
  <g transform="translate(0,182)">
    <circle cx="561" cy="-4.5" r="3.5" fill="#3fb950"/>
    <text x="572" y="0" fill="#8e8d89">Weekly</text>
    <text x="634" y="0" font-weight="700" fill="#ecebe8">15h 11m</text>
    <text x="704" y="0" fill="#8e8d89">Mon 03:00</text>
  </g>
  <path d="M743 196 749 203 755 196" fill="#30302d" stroke="#45443f"/>
  <rect x="742" y="194" width="14" height="3" fill="#30302d"/>
</svg>
